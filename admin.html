<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JF FORGES — Admin</title><link rel="stylesheet" href="style.css"></head><body class="admin-page"><div id="toast" class="toast"></div><main class="admin-shell"><div class="admin-top"><div><p class="eyebrow">PRIVATE AREA</p><h1>JF ADMIN</h1><p class="hint">Changes here are published to the same store customers see.</p></div><a class="ghost" href="index.html">← STORE</a></div><section id="loginBox" class="card"><h2>Admin Login</h2><label>Email<input id="adminEmail" type="email" autocomplete="username"></label><label>Password<input id="adminPassword" type="password" autocomplete="current-password"></label><button class="primary full" onclick="adminLogin()">ENTER ADMIN →</button><p class="hint">Admin is intentionally separate from the customer store. Customers will not see this page linked anywhere.</p></section><section id="adminApp" class="hidden"><div class="admin-tabs"><button class="active" onclick="showTab('productsTab',this)">PRODUCTS</button><button onclick="showTab('ordersTab',this)">ORDERS</button><button onclick="showTab('storeTab',this)">STORE</button></div><section id="productsTab"><div class="admin-toolbar"><div><h2>Products</h2><p class="hint">Drag the cards into any order, then SAVE ORDER.</p></div><div><button class="ghost" onclick="addProduct()">+ ADD PRODUCT</button><button class="primary" onclick="saveOrder()">SAVE ORDER</button></div></div><div id="adminProducts"></div></section><section id="ordersTab" class="hidden"><div class="admin-toolbar"><h2>Orders</h2><button class="danger" onclick="clearOrders()">CLEAR ORDERS</button></div><div id="adminOrders"></div></section><section id="storeTab" class="hidden"><div class="card"><h3>Store settings</h3><label>Collection title<input id="titleSetting"></label><label>JF WhatsApp number<input id="waSetting" placeholder="27712345678"></label><label>Order email<input id="emailSetting" type="email" placeholder="orders@yourdomain.com"></label><button class="primary" onclick="saveStore()">SAVE STORE SETTINGS</button></div></section></section></main><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
